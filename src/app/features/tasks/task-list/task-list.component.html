<div class="grid gap-4 p-6 max-w-4xl mx-auto">
  @for (task of tasks(); track task._id) {
    <p-card
      class="border-l-4"
      [ngClass]="{
        'border-blue-500': task.status === 'todo',
        'border-yellow-500': task.status === 'in-progress',
        'border-green-500': task.status === 'done'
      }"
    >
      <ng-template pTemplate="header">
        <div class="flex justify-between items-center">
          <span class="text-xl font-semibold">{{ task.title }}</span>
          <span
            class="text-sm px-2 py-1 rounded text-white"
            [ngClass]="{
              'bg-blue-500': task.status === 'todo',
              'bg-yellow-500': task.status === 'in-progress',
              'bg-green-500': task.status === 'done'
            }"
          >
            {{ task.status }}
          </span>
        </div>
      </ng-template>

      <p class="text-gray-700 mt-2">{{ task.description || 'Aucune description' }}</p>

      <ng-template pTemplate="footer">
        <span class="text-sm text-gray-500">🗓 {{ task.dueDate }}</span>
      </ng-template>
    </p-card>
  } @empty {
    <div class="text-gray-500 text-center italic">Aucune tâche pour le moment</div>
  }
</div>
